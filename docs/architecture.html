<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCPOp System Architecture</title>
<style>
  /*
   * Design:OS Diagram Architecture Contract
   * Fully self-contained, project token inheritance, zero script, accessible inline SVG.
   */
  :root {
    --diagram-paper:       #fafafa;
    --diagram-surface:     #ffffff;
    --diagram-ink:         #18181b;
    --diagram-muted:       #71717a;
    --diagram-soft:        #a1a1aa;
    --diagram-rule:        #e4e4e7;
    --diagram-rule-solid:  #d4d4d8;
    --diagram-accent:      #18181b;
    --diagram-accent-tint: #f4f4f5;
    --diagram-link:        #09090b;
    --diagram-success:     #15803d;
    --diagram-success-tint:#f0fdf4;
    --diagram-danger:      #be123c;
    --diagram-danger-tint: #fff1f2;
    --diagram-warning:     #b45309;
    --diagram-warning-tint:#fffbeb;

    --diagram-hairline: 1px;
    --diagram-gap: 24px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --diagram-paper:       #09090b;
      --diagram-surface:     #18181b;
      --diagram-ink:         #f4f4f5;
      --diagram-muted:       #a1a1aa;
      --diagram-soft:        #71717a;
      --diagram-rule:        #27272a;
      --diagram-rule-solid:  #3f3f46;
      --diagram-accent:      #ffffff;
      --diagram-accent-tint: #27272a;
      --diagram-link:        #fafafa;
      --diagram-success:     #4ade80;
      --diagram-success-tint:#052e16;
      --diagram-danger:      #fb7185;
      --diagram-danger-tint: #4c0519;
      --diagram-warning:     #fbbf24;
      --diagram-warning-tint:#451a03;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--diagram-paper);
    color: var(--diagram-ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 48px 32px;
    display: flex;
    justify-content: center;
  }

  .frame { max-width: 1140px; width: 100%; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--diagram-muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    margin-bottom: 8px;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--diagram-muted);
    margin-bottom: var(--diagram-gap);
  }

  .canvas {
    background: var(--diagram-surface);
    border: var(--diagram-hairline) solid var(--diagram-rule);
    border-radius: 12px;
    padding: 24px;
    overflow-x: auto;
  }

  svg { width: 100%; min-width: 980px; height: auto; display: block; }

  /* Node styling */
  .node-shape { fill: var(--diagram-surface); stroke: var(--diagram-rule-solid); stroke-width: var(--diagram-hairline); rx: 6px; }
  .node-shape--focal { fill: var(--diagram-accent-tint); stroke: var(--diagram-accent); stroke-width: 2px; }
  .node-shape--danger { fill: var(--diagram-danger-tint); stroke: var(--diagram-danger); }
  .node-shape--warning { fill: var(--diagram-warning-tint); stroke: var(--diagram-warning); }
  .node-shape--success { fill: var(--diagram-success-tint); stroke: var(--diagram-success); }

  .node-label { fill: var(--diagram-ink); font-size: 12px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  .node-sublabel { fill: var(--diagram-muted); font-size: 11px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .node-tag { fill: var(--diagram-muted); font-size: 10px; font-family: ui-monospace, monospace; text-transform: uppercase; }

  /* Zone styling */
  .zone { fill: var(--diagram-paper); stroke: var(--diagram-rule); stroke-width: var(--diagram-hairline); stroke-dasharray: 4 4; rx: 8px; }
  .zone-label { fill: var(--diagram-muted); font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }

  /* Edge & connector styling */
  .edge { fill: none; stroke: var(--diagram-rule-solid); stroke-width: 1.5; }
  .edge--fast { stroke: var(--diagram-success); stroke-width: 2; }
  .edge--async { stroke: var(--diagram-muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .edge--danger { stroke: var(--diagram-danger); stroke-width: 1.5; }
  .edge--warning { stroke: var(--diagram-warning); stroke-width: 1.5; }

  .edge-label { fill: var(--diagram-muted); font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  .edge-label--fast { fill: var(--diagram-success); font-weight: 600; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Design:OS Architecture Spec</p>
    <h1>MCPOp Transparent Proxy &amp; Failure Engine</h1>
    <p class="subtitle">Zero-overhead stdio interceptor, heuristic failure detector, and local observability dashboard.</p>

    <div class="canvas">
      <svg viewBox="0 0 1040 490" xmlns="http://www.w3.org/2000/svg"
           role="img"
           aria-labelledby="diagram-title diagram-desc"
           data-diagram-owned="true"
           data-diagram-grammar="architecture"
           data-reading-order="left-to-right"
           data-focal-id="node-mcpop-core"
           data-source-kind="brief">
        <title id="diagram-title">MCPOp System Architecture and Request Pipeline</title>
        <desc id="diagram-desc">An AI client communicates via stdio pipes through the MCPOp transparent proxy to a target MCP server. MCPOp asynchronously evaluates tool calls against loop, schema, and latency heuristics while streaming telemetry to an embedded SQLite store and web dashboard.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <path d="M 0 0 L 8 3 L 0 6 z" fill="currentColor"/>
          </marker>
        </defs>

        <!-- ZONE 1: AI Client -->
        <g data-diagram-element="zone" id="zone-client">
          <rect class="zone" x="30" y="40" width="220" height="410"/>
          <text class="zone-label" x="46" y="66">AI Client Layer</text>
        </g>

        <!-- ZONE 2: MCPOp Single Binary Core -->
        <g data-diagram-element="zone" id="zone-mcpop">
          <rect class="zone" x="270" y="40" width="480" height="410"/>
          <text class="zone-label" x="286" y="66">MCPOp Core (Go Binary)</text>
        </g>

        <!-- ZONE 3: Target Server -->
        <g data-diagram-element="zone" id="zone-target">
          <rect class="zone" x="770" y="40" width="230" height="410"/>
          <text class="zone-label" x="786" y="66">MCP Server Process</text>
        </g>

        <!-- NODE: AI Client -->
        <g data-diagram-element="node" id="node-ai-client">
          <rect class="node-shape" x="50" y="200" width="180" height="84"/>
          <text class="node-tag" x="66" y="222">Caller</text>
          <text class="node-label" x="66" y="244">Claude / Cursor</text>
          <text class="node-sublabel" x="66" y="264">Agent Runtime (stdio)</text>
        </g>

        <!-- NODE: Transparent Stdio Interceptor (Center Fast Path) -->
        <g data-diagram-element="node" id="node-proxy-interceptor">
          <rect class="node-shape" x="400" y="200" width="220" height="84"/>
          <text class="node-tag" x="416" y="222">Fast Path &lt;0.5ms</text>
          <text class="node-label" x="416" y="244">Stdio Interceptor</text>
          <text class="node-sublabel" x="416" y="264">Non-blocking I/O Pump</text>
        </g>

        <!-- NODE: Focal Core Heuristic Engine (Upper Tier) -->
        <g data-diagram-element="node" id="node-mcpop-core">
          <rect class="node-shape node-shape--focal" x="400" y="80" width="220" height="74"/>
          <text class="node-tag" x="416" y="102">Focal Component</text>
          <text class="node-label" x="416" y="122">Heuristics Engine</text>
          <text class="node-sublabel" x="416" y="140">Async Worker Goroutine</text>
        </g>

        <!-- NODE: Schema & Lag Validator (Upper Left) -->
        <g data-diagram-element="node" id="node-schema-validator">
          <rect class="node-shape node-shape--warning" x="290" y="80" width="94" height="74"/>
          <text class="node-label" x="302" y="104">Schema</text>
          <text class="node-label" x="302" y="120">&amp; Lag</text>
          <text class="node-tag" x="302" y="140">Audit</text>
        </g>

        <!-- NODE: Loop Detector (Upper Right) -->
        <g data-diagram-element="node" id="node-loop-detector">
          <rect class="node-shape node-shape--danger" x="636" y="80" width="94" height="74"/>
          <text class="node-label" x="648" y="104">Loop</text>
          <text class="node-label" x="648" y="120">Detector</text>
          <text class="node-tag" x="648" y="140">Fail &gt;=2</text>
        </g>

        <!-- NODE: SQLite Storage (Lower Left) -->
        <g data-diagram-element="node" id="node-sqlite">
          <rect class="node-shape" x="290" y="345" width="200" height="66"/>
          <text class="node-tag" x="306" y="365">Pure Go</text>
          <text class="node-label" x="306" y="383">SQLite Storage</text>
          <text class="node-sublabel" x="306" y="399">~/.mcpop/data.db (WAL)</text>
        </g>

        <!-- NODE: Dashboard & SSE Hub (Lower Right) -->
        <g data-diagram-element="node" id="node-dashboard-hub">
          <rect class="node-shape" x="530" y="345" width="200" height="66"/>
          <text class="node-tag" x="546" y="365">HTTP :4040</text>
          <text class="node-label" x="546" y="383">Dashboard &amp; SSE</text>
          <text class="node-sublabel" x="546" y="399">Real-time trace stream</text>
        </g>

        <!-- NODE: Target MCP Subprocess -->
        <g data-diagram-element="node" id="node-target-server">
          <rect class="node-shape" x="790" y="200" width="190" height="84"/>
          <text class="node-tag" x="806" y="222">Child Process</text>
          <text class="node-label" x="806" y="244">Target MCP Server</text>
          <text class="node-sublabel" x="806" y="264">Python / Node / Go Tools</text>
        </g>

        <!-- NODE: 1-Click Replay -->
        <g data-diagram-element="node" id="node-replay-runner">
          <rect class="node-shape node-shape--success" x="790" y="345" width="190" height="66"/>
          <text class="node-tag" x="806" y="365">Debug Mode</text>
          <text class="node-label" x="806" y="383">1-Click Replay</text>
          <text class="node-sublabel" x="806" y="399">Isolated subshell re-exec</text>
        </g>

        <!-- CONNECTORS (Strictly Orthogonal & Independently Traceable) -->

        <!-- Client -> Proxy (Fast Path Request) -->
        <line class="edge edge--fast" data-diagram-element="edge" id="edge-client-proxy"
              x1="230" y1="230" x2="400" y2="230" marker-end="url(#arrow)"/>
        <text class="edge-label edge-label--fast" x="315" y="222" text-anchor="middle">stdin</text>

        <!-- Proxy -> Client (Fast Path Response) -->
        <line class="edge edge--fast" data-diagram-element="edge" id="edge-proxy-client"
              x1="400" y1="255" x2="230" y2="255" marker-end="url(#arrow)"/>
        <text class="edge-label edge-label--fast" x="315" y="269" text-anchor="middle">stdout</text>

        <!-- Proxy -> Target (Direct Pass-Through Request) -->
        <line class="edge edge--fast" data-diagram-element="edge" id="edge-proxy-target"
              x1="620" y1="230" x2="790" y2="230" marker-end="url(#arrow)"/>
        <text class="edge-label edge-label--fast" x="705" y="222" text-anchor="middle">pass-through</text>

        <!-- Target -> Proxy (Direct Pass-Through Response) -->
        <line class="edge edge--fast" data-diagram-element="edge" id="edge-target-proxy"
              x1="790" y1="255" x2="620" y2="255" marker-end="url(#arrow)"/>
        <text class="edge-label edge-label--fast" x="705" y="269" text-anchor="middle">result/error</text>

        <!-- Proxy -> Core (Async Channel Event Queue Upward) -->
        <line class="edge edge--async" data-diagram-element="edge" id="edge-proxy-core"
              x1="510" y1="200" x2="510" y2="154" marker-end="url(#arrow)"/>
        <text class="edge-label" x="518" y="180">chan event</text>

        <!-- Core -> Schema Validator (Left) -->
        <line class="edge edge--warning" data-diagram-element="edge" id="edge-core-schema"
              x1="400" y1="117" x2="384" y2="117" marker-end="url(#arrow)"/>

        <!-- Core -> Loop Detector (Right) -->
        <line class="edge edge--danger" data-diagram-element="edge" id="edge-core-loop"
              x1="620" y1="117" x2="636" y2="117" marker-end="url(#arrow)"/>

        <!-- Core -> SQLite (Downward Left Path) -->
        <path class="edge edge--async" data-diagram-element="edge" id="edge-core-sqlite"
              d="M 440 154 V 315 H 390 V 345" marker-end="url(#arrow)"/>
        <text class="edge-label" x="350" y="332" text-anchor="middle">write trace</text>

        <!-- Core -> Dashboard (Downward Right Path) -->
        <path class="edge edge--async" data-diagram-element="edge" id="edge-core-dashboard"
              d="M 580 154 V 315 H 630 V 345" marker-end="url(#arrow)"/>
        <text class="edge-label" x="668" y="332" text-anchor="middle">SSE broadcast</text>

        <!-- Dashboard -> Replay Runner -->
        <line class="edge" data-diagram-element="edge" id="edge-dashboard-replay"
              x1="730" y1="378" x2="790" y2="378" marker-end="url(#arrow)"/>
        <text class="edge-label" x="760" y="370" text-anchor="middle">invoke</text>
      </svg>
    </div>
  </div>
</body>
</html>
